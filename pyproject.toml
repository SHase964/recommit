[project]
name = "recommit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.6"
dependencies = [
    "anthropic>=0.119.0",
    "mypy>=2.1.0",
    "pydantic>=2.13.4",
    "ruff>=0.15.20",
]

[tool.pyright]
reportCallIssue = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]

[tool.mypy]
disallow_untyped_defs = true
explicit_package_bases = true
no_implicit_optional = true
show_column_numbers = true
show_error_context = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true

[tool.ruff]
exclude = [
    "__pycache__",
    ".git",
    ".import_linter_cache",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "third_party",
]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
fixable = ["ALL"]
unfixable = []
select = [
    "A",  # flake8-builtin
    "B",  # flake8-bugbear
    "E",  # pycodestyle error
    "F",  # Pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "W",  # pycodestyle warning
    "PL", # Pylint
    "UP", # pyupgrade
]
ignore = [
    "ANN401",  # any-type
    "B905",    # Zip-without-explicit-strict
    "BLE001",  # Do not catch blind exception: `Exception`
    "COM812",  # missing-trailing-comma (conflicts with ruff format)
    "D",       # pydocstyle (don't require docstrings)
    "ERA001",  # commented-out-code
    "F403",    # Unable to detect undefined names
    "FBT001",  # Boolean-typed positional argument in function definition
    "FBT002",  # Boolean default positional argument in function definition
    "FIX002",  # line-contains-todo
    "INP001",  # implicit-namespace-package (no __init__.py required)
    "ISC001",  # single-line-implicit-string-concatenation (conflicts with ruff format)
    "N812",    # Lowercase imported as non-lowercase    # Lowercase imported as non-lowercase
    "N999",    # Invalid module name
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments in function definition
    "PLR2004", # Magic value used in comparison
    "PTH",     # flake8-use-pathlib (allow os.path)
    "PYI034",  # non-self-return-type
    "RET504",  # unnecessary-assign
    "RUF002",  # ambiguous-unicode-character-docstring
    "RUF003",  # ambiguous-unicode-character-comment
    "S104",    # hardcoded-bind-all-interfaces (bind to specific interfaces)
    "T201",    # no print statements
    "TD002",   # missing-todo-author
    "TD003",   # missing-todo-link
    "TRY201",  # Use `raise` without specifying exception name
]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
force-wrap-aliases = true
known-first-party = ["backend"]

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=8.4.0",
]
