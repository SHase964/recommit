name: Claude Auto Review with Tracking
on:
  pull_request:
    types: [opened, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true # ✨ Enables tracking comments
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            このプルリクエストの変更差分をレビューしてください。
            指摘は GitHub のインラインコメントで、観点ごとに分けて行ってください。

            # 前提
            - 指摘対象は変更差分のみ。周辺の既存コードは整合性確認の参考に読むだけで、指摘はしない。
            - 変更ファイルは差分だけでなく全体を読み、文脈を踏まえること。

            # コメントの書き方
            - 各コメントは簡潔に。前置きや背景説明は書かず「何が問題か」「どう直すか」の2点のみ。
            - 目安は3〜5行以内。修正案はコード片や差分の形で短く示す（長文の説明文にしない）。

            # 観点
            - 正確性: ロジックの誤り、境界条件、想定外の入力で壊れないか。
            - 例外処理: エラー時の挙動、null / None の扱い、失敗の握りつぶしがないか。
            - 可読性: 初見でも追えるか。ガード節で早期 return し、ネストを浅く保てているか。
            - 命名: 役割が名前から分かるか。同じ概念に同じ名前を使えているか（表記揺れがないか）。
            - 重複と責務: 重複コードを共通化できないか。関数・クラスの責務が適切に分かれているか。
            - 一貫性: 既存コードの規約・パターン・型定義と整合しているか。
            - パフォーマンス: 計算量・メモリ・無駄な処理の観点で改善余地はないか。
            - セキュリティ: 機密情報の露出、入力検証、共有状態の扱いに問題がないか。

          claude_args: |
            --model claude-sonnet-5
            --effort low
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"